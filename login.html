<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Restroom Radar — Login</title>
  <link rel="stylesheet" href="style.css" />
  <style>
  

.brand{
  text-align: center;
  padding: 20px;
  background-color: hwb(153 78% 9%);
}

    .login-root {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    .login-box {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-box label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    .login-box input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .login-actions {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
        <h1>Restroom Radar</h1>
        <p>Find public restrooms near you</p>
      </div>
    </div>
  </header>

  <main class="login-root">
    <form id="login-form" class="login-box" novalidate>
      <h3 style="margin:0 0 6px 0">Sign in to Restroom Radar</h3>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required placeholder="e.g. alex123">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter a password">

      <label for="zipcode">Zip Code</label>
      <input id="zipcode" name="zipcode" type="text" inputmode="numeric" pattern="[0-9]*" required placeholder="5-digit ZIP code">

      <div style="margin-top:8px;color:#c53030;font-size:13px" id="login-error" role="status" aria-live="polite"></div>

      <div class="login-actions">
        <button id="submit-login" type="submit" class="btn-primary">Go to Radar</button>
        <button id="guest-btn" type="button" class="small-link">Continue as Guest</button>
      </div>
    </form>
  </main>

  <script>
    // ...existing code...
    (function () {
      const form = document.getElementById('login-form');
      const usernameEl = document.getElementById('username');
      const passwordEl = document.getElementById('password');
      const zipcodeEl = document.getElementById('zipcode');
      const guestBtn = document.getElementById('guest-btn');
      const errorEl = document.getElementById('login-error');

      // If login page was requested with returnTo, use it after login
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get('returnTo') || 'index.html';

      function showError(msg) {
        errorEl.textContent = msg || '';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        showError('');

        const username = (usernameEl.value || '').trim();
        const password = (passwordEl.value || '').trim();
        const zipcode = (zipcodeEl.value || '').trim();

        if (!username) { showError('Please enter a username.'); usernameEl.focus(); return; }
        if (!password) { showError('Please enter a password.'); passwordEl.focus(); return; }
        if (!/^\d{5}$/.test(zipcode)) { showError('Please enter a valid 5-digit ZIP code.'); zipcodeEl.focus(); return; }

        // Save a simple local session (mock authentication)
        const user = { username: username, zipcode: zipcode, loggedAt: Date.now() };
        try { sessionStorage.setItem('user', JSON.stringify(user)); } catch (e) { console.warn('sessionStorage error', e); }

        // Redirect to the intended page
        window.location.href = returnTo;
      });

      guestBtn.addEventListener('click', function (e) {
        e.preventDefault();
        // create a lightweight guest session
        const guest = { username: 'guest', zipcode: '00000', guest: true, loggedAt: Date.now() };
        try { sessionStorage.setItem('user', JSON.stringify(guest)); } catch (e) { console.warn('sessionStorage error', e); }
        window.location.href = returnTo;
      });

      // Optional: prefill from session if present
      try {
        const existing = JSON.parse(sessionStorage.getItem('user') || 'null');
        if (existing && existing.username) usernameEl.value = existing.username;
        if (existing && existing.zipcode) zipcodeEl.value = existing.zipcode;
      } catch (e) { /* ignore parse errors */ }
    })();
    // ...existing code...
  </script>
</body>
</html>
