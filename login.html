<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Restroom Radar — Login</title>
  <link rel="stylesheet" href="style.css" />
  <style>
  

.brand{
  text-align: center;
  padding: 20px;
  background-color: hwb(153 78% 9%);
}

    .login-root {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    .login-box {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-box label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    .login-box input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .login-actions {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
        <h1>Restroom Radar</h1>
        <p>Find public restrooms near you</p>
      </div>
    </div>
  </header>

  <main class="login-root">
    <form id="login-form" class="login-box" novalidate>
      <h3 style="margin:0 0 6px 0">Sign in to Restroom Radar</h3>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required placeholder="e.g. alex123">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter a password">

      <label for="zipcode">Zip Code</label>
      <input id="zipcode" name="zipcode" type="text" inputmode="numeric" pattern="[0-9]*" required placeholder="5-digit ZIP code">

      <div style="margin-top:8px;color:#c53030;font-size:13px" id="login-error" role="status" aria-live="polite"></div>

      <div class="login-actions">
        <button id="submit-login" type="submit" class="btn-primary">Go to Radar</button>

        <a class="small-link" href="index.html" id="guest-btn">Continue as Guest</a>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <a class="small-link" href="#" onclick="alert('Reset password placeholder');return false">Forgot password?</a>
        <a class="small-link" href="#" onclick="alert('Create account placeholder');return false">Create account</a>
      </div>
    </form>
  </main>

  <script>
document.addEventListener('DOMContentLoaded', () => {


  const gallery = document.querySelector('.side-images');

  if (gallery) {

    // Mouse wheel horizontal scroll
    gallery.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        gallery.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // Keyboard navigation
    gallery.setAttribute('tabindex', '0');

    gallery.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        gallery.scrollLeft += 250;
      }

      if (e.key === 'ArrowLeft') {
        gallery.scrollLeft -= 250;
      }
    });
  }

  // =========================
  // FORM ELEMENTS
  // =========================
  const form = document.getElementById('login-form');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const zipcode = document.getElementById('zipcode');
  const guestBtn = document.getElementById('guest-btn');

  // =========================
  // ERROR HELPERS
  // =========================
  function showError(input, message) {

    clearError(input);

    input.classList.add('invalid');

    const error = document.createElement('div');
    error.className = 'input-error';
    error.setAttribute('aria-live', 'polite');
    error.textContent = message;

    input.insertAdjacentElement('afterend', error);
  }

  function clearError(input) {

    input.classList.remove('invalid');

    const next = input.nextElementSibling;

    if (next && next.classList.contains('input-error')) {
      next.remove();
    }
  }

  // =========================
  // VALIDATION
  // =========================
  function validateForm() {

    let valid = true;

    // Username
    if (username.value.trim().length < 2) {
      showError(username, 'Username must be at least 2 characters');
      valid = false;
    } else {
      clearError(username);
    }

    // Password
    if (password.value.trim().length < 4) {
      showError(password, 'Password must be at least 4 characters');
      valid = false;
    } else {
      clearError(password);
    }

    // ZIP code
    const zip = zipcode.value.trim();

    if (!/^\d{5}$/.test(zip)) {
      showError(zipcode, 'Enter a valid 5-digit ZIP code');
      valid = false;
    } else {
      clearError(zipcode);
    }

    return valid;
  }

  // =========================
  // LOGIN SUBMIT
  // =========================
  form.addEventListener('submit', (e) => {

    e.preventDefault();

    if (!validateForm()) {
      return;
    }

    // Save session
    const user = {
      username: username.value.trim(),
      zipcode: zipcode.value.trim(),
      loggedIn: true
    };

    try {
      sessionStorage.setItem('rr_user', JSON.stringify(user));
    } catch (err) {
      console.error('Session storage failed:', err);
    }

    // Redirect to map page
    window.location.href = 'index.html';
  });

  // =========================
  // GUEST LOGIN
  // =========================
  if (guestBtn) {

    guestBtn.addEventListener('click', (e) => {

      e.preventDefault();

      const guestUser = {
        username: 'Guest',
        guest: true,
        loggedIn: true
      };

      try {
        sessionStorage.setItem('rr_user', JSON.stringify(guestUser));
      } catch (err) {
        console.error('Session storage failed:', err);
      }

      window.location.href = 'index.html';
    });
  }

  // =========================
  // LIVE INPUT CLEARING
  // =========================
  [username, password, zipcode].forEach((input) => {

    input.addEventListener('input', () => {
      clearError(input);
    });
  });

});
</script>
</body>
</html>
