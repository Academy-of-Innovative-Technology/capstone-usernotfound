<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile - Restroom Radar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container navbar">
      <h1 class="brand">🚻 Restroom Radar</h1>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="map.html">Map</a>
      </nav>
      <div class="search-wrap"><input class="search-input" type="text" placeholder="Search..."></div>
    </div>
  </header>

  <main class="container" style="padding-top:110px; padding-bottom:60px;">
    <div class="profile-card">
      <div class="profile-avatar">
        <img src="https://placehold.co/120x120/9fb8ff/fff?text=Me" alt="User avatar">
      </div>
      <div class="profile-info">
        <h2>Jane Doe</h2>
        <p class="muted">Member since 2024 • New York, NY</p>

        <div class="profile-fields">
          <div><strong>Email</strong><div class="muted">jane@example.com</div></div>
          <div><strong>Phone</strong><div class="muted">(555) 555-5555</div></div>
        </div>

        <div style="margin-top:18px;">
          <button class="btn-primary">Edit Profile</button>
          <button class="btn-secondary">View My Spots</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container">&copy; <span id="year"></span> Restroom Radar</div></footer>
  <script>document.getElementById('year').innerText = new Date().getFullYear();</script>
</body>
</html>
